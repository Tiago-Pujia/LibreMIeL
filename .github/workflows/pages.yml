name: Desplegar Sitio Web y Descargas (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/web/**'
      - 'packaging/linux/libremiel.png'
      - 'packaging/linux/libremiel.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar Landing Page en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Sincronizar íconos oficiales y preparar artefacto web
        run: |
          mkdir -p packaging/web/assets
          cp packaging/linux/libremiel.png packaging/web/assets/libremiel.png
          cp packaging/linux/libremiel.svg packaging/web/assets/libremiel.svg
          touch packaging/web/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'packaging/web'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
