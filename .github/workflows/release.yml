name: Release Multiplataforma (Windows, macOS, Linux y Android — x64 y ARM64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión para compilar manualmente (ej. 0.1.0)'
        required: false
        default: '0.1.0-dev'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 0. VERIFICACIÓN PREVIA Y RESOLUCIÓN DE VERSIÓN
  # ============================================================================
  prepare:
    name: Validar código y resolver versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver número de versión
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version || '0.1.0-dev' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - run: python3 -m unittest discover -s scripts -v

  # ============================================================================
  # 1. ANDROID (APK Universal + Split ARM64 / ARMv7 / x86_64)
  # ============================================================================
  build-android:
    name: Build Android (APK Universal + ARM64/ARMv7/x86_64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configurar firma de release si existen GitHub Secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/app/release.keystore
          cat > app/android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - working-directory: app
        run: flutter pub get

      - name: Aceptar licencias de Android SDK (API 37+)
        shell: bash
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null || true
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Compilar APKs (Universal + arm64-v8a + armeabi-v7a + x86_64)
        working-directory: app
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p ../dist/android
          flutter build apk --release --build-name="$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/android/LibreMIeL-${VERSION}-android-universal.apk"

          flutter build apk --release --split-per-abi --build-name="$VERSION"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "../dist/android/LibreMIeL-${VERSION}-android-${abi}.apk"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/android/*

  # ============================================================================
  # 2. LINUX x64 y ARM64 (Portable .tar.gz, AppImage, .deb, .rpm, Arch .pkg.tar.zst)
  # Nota: `ubuntu-24.04-arm` es gratuito en repositorios públicos de GitHub.
  # ============================================================================
  build-linux:
    name: Build Linux ${{ matrix.flutter_arch }} (AppImage, DEB, RPM, Arch, Portable)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            flutter_arch: x64
            nfpm_arch: amd64
            linux_arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            flutter_arch: arm64
            nfpm_arch: arm64
            linux_arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de compilación Linux (${{ matrix.flutter_arch }})
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build linux --release --build-name="${{ needs.prepare.outputs.version }}"

      - name: Empaquetar Linux Portable (.tar.gz)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          FARCH="${{ matrix.flutter_arch }}"
          mkdir -p "dist/linux-${FARCH}"
          tar -czf "dist/linux-${FARCH}/LibreMIeL-${VERSION}-linux-${FARCH}-portable.tar.gz" \
            -C "app/build/linux/${FARCH}/release/bundle" .

      - name: Instalar appimagetool (${{ matrix.linux_arch }}) y compilar AppImage
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          LARCH="${{ matrix.linux_arch }}"
          FARCH="${{ matrix.flutter_arch }}"
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${LARCH}.AppImage" \
            -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          chmod +x packaging/linux/build_appimage.sh
          ./packaging/linux/build_appimage.sh "$VERSION" "$FARCH"

      - name: Instalar nFPM y generar paquetes .deb, .rpm y Arch .pkg.tar.zst (${{ matrix.flutter_arch }})
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          FARCH="${{ matrix.flutter_arch }}"
          LARCH="${{ matrix.linux_arch }}"
          DARCH="${{ matrix.deb_arch }}"
          export LIBREMIEL_VERSION="$VERSION"
          export NFPM_ARCH="${{ matrix.nfpm_arch }}"
          export FLUTTER_ARCH="$FARCH"

          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm gettext-base

          envsubst < packaging/linux/nfpm.yaml > /tmp/nfpm-resolved.yaml

          nfpm package -f /tmp/nfpm-resolved.yaml -p deb \
            -t "dist/linux-${FARCH}/LibreMIeL-${VERSION}-linux-${DARCH}.deb"
          nfpm package -f /tmp/nfpm-resolved.yaml -p rpm \
            -t "dist/linux-${FARCH}/LibreMIeL-${VERSION}-linux-${LARCH}.rpm"
          nfpm package -f /tmp/nfpm-resolved.yaml -p archlinux \
            -t "dist/linux-${FARCH}/LibreMIeL-${VERSION}-linux-${LARCH}.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.flutter_arch }}
          path: dist/linux-${{ matrix.flutter_arch }}/*

  # ============================================================================
  # 3. WINDOWS x64 y ARM64 (Instalador .exe Inno Setup + Portable .zip)
  # Nota: `windows-11-arm` es gratuito en repositorios públicos de GitHub.
  # ============================================================================
  build-windows:
    name: Build Windows ${{ matrix.flutter_arch }} (Instalador EXE y Portable ZIP)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            flutter_arch: x64
            allow_failure: false
          - runner: windows-11-arm
            flutter_arch: arm64
            allow_failure: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build windows --release --build-name="${{ needs.prepare.outputs.version }}"

      - name: Empaquetar Windows Portable (.zip)
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.flutter_arch }}"
          $releaseDir = "app\build\windows\${arch}\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            throw "No se encontró el directorio de build esperado: $releaseDir"
          }
          New-Item -ItemType Directory -Force -Path "dist\windows-${arch}" | Out-Null
          Compress-Archive -Path "$releaseDir\*" `
            -DestinationPath "dist\windows-${arch}\LibreMIeL-${ver}-windows-${arch}-portable.zip" -Force

      - name: Compilar Instalador Windows (.exe con Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.flutter_arch }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }
          & $iscc "/DAppVersion=$ver" "/DAppArch=$arch" "packaging\windows\installer.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.flutter_arch }}
          path: dist/windows-${{ matrix.flutter_arch }}/*

  # ============================================================================
  # 4. macOS Universal Binary — x86_64 Intel + arm64 Apple Silicon (.dmg + .zip)
  # ============================================================================
  build-macos:
    name: Build macOS Universal (x86_64 + arm64 — DMG y Portable ZIP)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build macos --release --build-name="${{ needs.prepare.outputs.version }}"

      - name: Verificar Universal Binary (x86_64 + arm64) y empaquetar (.zip y .dmg)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APP_PATH="app/build/macos/Build/Products/Release/LibreMIeL.app"
          lipo -info "$APP_PATH/Contents/MacOS/LibreMIeL"
          mkdir -p dist/macos dist/macos/dmg_root

          # Portable .zip (Universal x86_64 + arm64)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "dist/macos/LibreMIeL-${VERSION}-macos-universal-portable.zip"

          # Instalador .dmg (Universal x86_64 + arm64)
          cp -R "$APP_PATH" dist/macos/dmg_root/
          ln -s /Applications dist/macos/dmg_root/Applications
          hdiutil create -volname "LibreMIeL" -srcfolder dist/macos/dmg_root \
            -ov -format UDZO "dist/macos/LibreMIeL-${VERSION}-macos-universal.dmg"
          rm -rf dist/macos/dmg_root

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/macos/*

  # ============================================================================
  # 5. PUBLICAR GITHUB RELEASE CON CHECKSUMS SHA-256
  # ============================================================================
  publish-release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generar SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
